<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الترشيحات وإدارة المواقع</title>
  
  <style>
    /* ==========================================================================
       1. التنسيقات الأساسية وإعادة الضبط (Reset & Base Styles)
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #0b0f12;
      color: #e0e0e0;
      line-height: 1.6;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 30px 15px;
    }

    /* ==========================================================================
       2. الهيدر والعناوين (Header & Typography)
       ========================================================================== */
    .header-container {
      text-align: center;
      margin-bottom: 30px;
      width: 100%;
      max-width: 500px;
    }

    .header-title {
      color: #00f2fe;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
      margin-bottom: 8px;
    }

    .header-subtitle {
      color: #718096;
      font-size: 0.95rem;
    }

    /* ==========================================================================
       3. حاويات النماذج (Containers & Cards)
       ========================================================================== */
    .container {
      width: 100%;
      max-width: 500px;
      background: #131a1e;
      border: 1px solid #1f2930;
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .container:hover {
      border-color: rgba(0, 242, 254, 0.3);
      box-shadow: 0 12px 35px rgba(0, 242, 254, 0.08);
    }

    .container h3 {
      color: #00f2fe;
      margin-bottom: 20px;
      font-size: 1.25rem;
      font-weight: 700;
      border-bottom: 1px solid #1f2930;
      padding-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ==========================================================================
       4. عناصر الإدخال والاستشارات (Form Controls)
       ========================================================================== */
    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
    }

    label {
      display: block;
      font-size: 0.88rem;
      color: #a0aec0;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input[type="text"], 
    select, 
    textarea, 
    input[type="file"] {
      width: 100%;
      padding: 14px 16px;
      background: #0b0f12;
      border: 1px solid #222d34;
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.25s ease-in-out;
    }

    input[type="text"]::placeholder,
    textarea::placeholder {
      color: #4a5568;
    }

    input[type="text"]:focus, 
    select:focus, 
    textarea:focus {
      border-color: #00f2fe;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
      background-color: #0e1418;
    }

    select {
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300f2fe' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: left 15px center;
      background-size: 16px;
      padding-left: 40px;
    }

    select option {
      background-color: #131a1e;
      color: #ffffff;
      padding: 10px;
    }

    input[type="file"] {
      padding: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #a0aec0;
    }

    input[type="file"]::-webkit-file-upload-button {
      background: #1f2930;
      border: none;
      color: #00f2fe;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 10px;
      transition: background 0.2s ease;
    }

    input[type="file"]::-webkit-file-upload-button:hover {
      background: #2a3742;
    }

    /* ==========================================================================
       5. الأزرار (Buttons)
       ========================================================================== */
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      border: none;
      border-radius: 10px;
      color: #05080a;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
      filter: brightness(1.1);
    }

    .btn-submit:active {
      transform: translateY(0);
      box-shadow: 0 2px 10px rgba(0, 242, 254, 0.2);
    }

    /* ==========================================================================
       6. قائمة عرض الترشيحات (Sites List)
       ========================================================================== */
    .sites-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 400px;
      overflow-y: auto;
      padding-left: 5px;
    }

    .sites-list::-webkit-scrollbar {
      width: 6px;
    }

    .sites-list::-webkit-scrollbar-track {
      background: #0b0f12;
      border-radius: 10px;
    }

    .sites-list::-webkit-scrollbar-thumb {
      background: #1f2930;
      border-radius: 10px;
    }

    .sites-list::-webkit-scrollbar-thumb:hover {
      background: #00f2fe;
    }

    .site-card {
      background: #0b0f12;
      border: 1px solid #222d34;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .site-card:hover {
      transform: translateX(-4px);
      border-color: rgba(0, 242, 254, 0.4);
    }

    .site-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .site-info h4 {
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
    }

    .site-info span {
      color: #00f2fe;
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(0, 242, 254, 0.08);
      padding: 2px 8px;
      border-radius: 4px;
      width: fit-content;
    }

    .site-date {
      color: #4a5568;
      font-size: 0.78rem;
    }

    .empty-state {
      color: #718096;
      text-align: center;
      padding: 20px 0;
      font-size: 0.9rem;
    }

    /* ==========================================================================
       7. تصميم الـ Modal الاحترافي المخصص (Custom Modal)
       ========================================================================== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(5, 8, 10, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background: #12191d;
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 24px;
      padding: 35px 28px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 0 40px rgba(0, 242, 254, 0.15), 0 25px 50px rgba(0, 0, 0, 0.9);
      transform: scale(0.7) translateY(30px);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1) translateY(0);
    }

    .modal-icon-box {
      width: 70px;
      height: 70px;
      margin: 0 auto 18px auto;
      border-radius: 50%;
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid rgba(0, 242, 254, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
    }

    .modal-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .modal-message {
      font-size: 0.95rem;
      color: #a0aec0;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .modal-btn {
      width: 100%;
      padding: 13px;
      background: #00f2fe;
      color: #0b0f12;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
    }

    .modal-btn:hover {
      background: #33f5fe;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
    }

    .modal-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <!-- ==========================================================================
       الهيدر الأساسي
       ========================================================================== -->
  <div class="header-container">
    <h1 class="header-title">لوحة التفاعل والترشيحات</h1>
    <p class="header-subtitle">قم بإضافة مواقك وترشيحاتك المفضلة بكل سهولة</p>
  </div>

  <!-- ==========================================================================
       Modal الموحد البديل لـ alert
       ========================================================================== -->
  <div id="customModal" class="modal-overlay">
    <div class="modal-card">
      <div id="modalIcon" class="modal-icon-box">✨</div>
      <div id="modalTitle" class="modal-title">تنبيه</div>
      <div id="modalMessage" class="modal-message">رسالة التنبيه...</div>
      <button class="modal-btn" onclick="closeModal()">حسناً</button>
    </div>
  </div>

  <!-- ==========================================================================
       1. نموذج إنشاء حساب جديد
       ========================================================================== -->
  <div class="container">
    <h3>
      <span>✨</span>
      <span>إنشاء حساب جديد</span>
    </h3>
    <form id="signupForm" autocomplete="off">
      <div class="form-group">
        <label for="signupName">اسم المستخدم</label>
        <input type="text" id="signupName" placeholder="أدخل اسمك الكامل..." required>
      </div>
      <button type="submit" class="btn-submit">
        <span>إنشاء الحساب</span>
      </button>
    </form>
  </div>

  <!-- ==========================================================================
       2. نموذج إضافة موقع إلى القسم
       ========================================================================== -->
  <div class="container">
    <h3>
      <span>➕</span>
      <span>إضافة موقع إلى قسم</span>
    </h3>
    <form id="addSiteForm" autocomplete="off">
      <div class="form-group">
        <label for="siteCategory">اختر القسم</label>
        <select id="siteCategory" required>
          <option value="" disabled selected>اختر القسم المناسب...</option>
          <option value="برمجة">برمجة</option>
          <option value="ألعاب">ألعاب</option>
          <option value="أدوات">أدوات</option>
          <option value="تصميم">تصميم</option>
          <option value="عام">عام</option>
        </select>
      </div>

      <div class="form-group">
        <label for="siteName">اسم الموقع أو الترشيح</label>
        <input type="text" id="siteName" placeholder="مثال: موقع ببجي الرسمي..." required>
      </div>

      <div class="form-group">
        <label for="siteImage">صورة الموقع (اختياري)</label>
        <input type="file" id="siteImage" accept="image/*">
      </div>

      <button type="submit" class="btn-submit">
        <span>إضافة الموقع الآن</span>
      </button>
    </form>
  </div>

  <!-- ==========================================================================
       3. قائمة الترشيحات المضافة (تحميل من data.json + LocalStorage)
       ========================================================================== -->
  <div class="container">
    <h3>
      <span>⭐️</span>
      <span>ترشيحات المواقع (من JSON)</span>
    </h3>
    <div id="sitesList" class="sites-list">
      <!-- يتم جلب القائمة وتوليدها هنا عبر JavaScript -->
    </div>
  </div>

  <!-- ==========================================================================
       البرمجة والتفاعل (JavaScript)
       ========================================================================== -->
  <script>
    // ------------------------------------------------------------------
    // 1. نظام الـ Modal الاحترافي (بديل الـ alert)
    // ------------------------------------------------------------------
    function showModal(title, message, icon = '✨') {
      const modal = document.getElementById('customModal');
      const titleEl = document.getElementById('modalTitle');
      const msgEl = document.getElementById('modalMessage');
      const iconEl = document.getElementById('modalIcon');

      if (titleEl && msgEl && iconEl && modal) {
        titleEl.innerText = title;
        msgEl.innerText = message;
        iconEl.innerText = icon;
        modal.classList.add('active');
      }
    }

    function closeModal() {
      const modal = document.getElementById('customModal');
      if (modal) {
        modal.classList.remove('active');
      }
    }

    // إغلاق النوافذ عند الضغط خارج بطاقة الـ Modal
    document.addEventListener('DOMContentLoaded', function() {
      const modalOverlay = document.getElementById('customModal');
      if (modalOverlay) {
        modalOverlay.addEventListener('click', function(event) {
          if (event.target === this) {
            closeModal();
          }
        });
      }
    });

    // ------------------------------------------------------------------
    // 2. قراءة وملف data.json وإدارة البيانات
    // ------------------------------------------------------------------
    async function fetchJsonSites() {
      try {
        const response = await fetch('data.json', { cache: 'no-cache' });
        if (!response.ok) {
          throw new Error('فشل جلب الملف: ' + response.statusText);
        }
        const jsonData = await response.json();
        return Array.isArray(jsonData) ? jsonData : [];
      } catch (error) {
        console.warn('تنبيه: تعذر قراءة data.json مباشرة، جاري الاعتماد على التخزين المحلي.', error);
        return [];
      }
    }

    function getLocalSites() {
      try {
        const savedData = localStorage.getItem('user_sites');
        return savedData ? JSON.parse(savedData) : [];
      } catch (err) {
        console.error('خطأ في قراءة الـ LocalStorage:', err);
        return [];
      }
    }

    function saveSiteToLocalStorage(siteObj) {
      try {
        let currentSites = getLocalSites();
        currentSites.unshift(siteObj);
        localStorage.setItem('user_sites', JSON.stringify(currentSites));
      } catch (err) {
        console.error('خطأ في كتابة الـ LocalStorage:', err);
      }
    }

    async function loadAndDisplayAllSites() {
      const listContainer = document.getElementById('sitesList');
      if (!listContainer) return;

      // 1. جلب بيانات ملف data.json
      const jsonSites = await fetchJsonSites();

      // 2. جلب إضافات المستخدم المحلية
      const localSites = getLocalSites();

      // 3. دمج المجموعتين
      const combinedSites = [...localSites, ...jsonSites];

      // 4. بناء الـ HTML
      renderSitesUI(combinedSites, listContainer);
    }

    function renderSitesUI(sitesArray, container) {
      if (!sitesArray || sitesArray.length === 0) {
        container.innerHTML = '<div class="empty-state">لا توجد مواقـع أو ترشيحات مضافة حتى الآن.</div>';
        return;
      }

      let htmlOutput = '';

      for (let i = 0; i < sitesArray.length; i++) {
        const item = sitesArray[i];
        const siteTitle = item.name || item.title || 'موقع بدون عنوان';
        const siteCategory = item.category || 'عام';
        const siteDate = item.date || 'منذ فترة';

        htmlOutput += `
          <div class="site-card">
            <div class="site-info">
              <h4>${escapeHtml(siteTitle)}</h4>
              <span>${escapeHtml(siteCategory)}</span>
            </div>
            <div class="site-date">${escapeHtml(siteDate)}</div>
          </div>
        `;
      }

      container.innerHTML = htmlOutput;
    }

    // دالة لتنظيف مدخلات النص وحمايتها من XSS
    function escapeHtml(text) {
      if (typeof text !== 'string') return text;
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // ------------------------------------------------------------------
    // 3. معالجة نموذج إنشاء الحساب
    // ------------------------------------------------------------------
    const signupForm = document.getElementById('signupForm');
    if (signupForm) {
      signupForm.addEventListener('submit', function(event) {
        event.preventDefault();
        
        const nameInput = document.getElementById('signupName');
        const userName = nameInput ? nameInput.value.trim() : '';

        if (userName !== '') {
          showModal('تم الحساب بنجاح', `أهلاً بك يا ${userName}! تم إنشاء الحساب بنجاح.`, '🎉');
          signupForm.reset();
        } else {
          showModal('خطأ', 'يرجى كتابة اسم المستخدم أولاً!', '⚠️');
        }
      });
    }

    // ------------------------------------------------------------------
    // 4. معالجة نموذج إضافة موقع
    // ------------------------------------------------------------------
    const addSiteForm = document.getElementById('addSiteForm');
    if (addSiteForm) {
      addSiteForm.addEventListener('submit', function(event) {
        event.preventDefault();

        const categorySelect = document.getElementById('siteCategory');
        const nameInput = document.getElementById('siteName');

        const selectedCategory = categorySelect ? categorySelect.value : '';
        const siteNameValue = nameInput ? nameInput.value.trim() : '';

        if (!selectedCategory) {
          showModal('تنبيه', 'يرجى اختيار القسم المناسب من القائمة.', '⚠️');
          return;
        }

        if (!siteNameValue) {
          showModal('تنبيه', 'يرجى إدخال اسم الموقع.', '⚠️');
          return;
        }

        // إنشاء كائن البيانات للموقع الجديد
        const newSiteObject = {
          name: siteNameValue,
          category: selectedCategory,
          date: new Date().toLocaleDateString('ar-EG')
        };

        // حفظ بالـ LocalStorage
        saveSiteToLocalStorage(newSiteObject);

        // إعادة عرض القائمة بالبيانات الجديدة
        loadAndDisplayAllSites();

        // إظهار Modal النجاح بدلاً من alert
        showModal('تم القبول', 'تم قبول الترشيح وإضافة الموقع إلى القائمة بنجاح! ✔', '✅');

        // إعادة تفريغ الحقول
        addSiteForm.reset();
      });
    }

    // ------------------------------------------------------------------
    // 5. التشغيل الأولي عند تحميل DOM بالكامل
    // ------------------------------------------------------------------
    window.addEventListener('DOMContentLoaded', function() {
      loadAndDisplayAllSites();
    });
  </script>
</body>
</html>
